services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ganttai
      POSTGRES_USER: ganttai
      POSTGRES_PASSWORD: ganttai
    ports:
      - "5432:5432"
    volumes:
      - ganttai-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ganttai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ganttai-postgres:
